name: tmp-audio
on:
  push:
    branches: [tmp-audio]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSfL -o voz.mp3 "https://assets.vidiq.com/voiceovers/458fe131-fe0b-4855-b1a1-26d35e475939/ce6d25bc-6343-47fb-af67-a8fba5fbbd4c.mp3"
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add voz.mp3; git commit -m "audio"; git push
